[package]
name = "ifa-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for Ifa-Lang playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Use ifa-vm without native/sandbox features
ifa-vm = { path = "../ifa-vm", default-features = false, features = ["compiler"] }
ifa-parser = { path = "../ifa-parser" }
ifa-types = { path = "../ifa-types" }
ifa-fmt = { path = "../ifa-fmt" }
# Use ifa-std with WASM-compatible features
ifa-std = { path = "../ifa-std", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4.42"
serde_json = "1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
