[package]
name = "ifa-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Infrastructure layer for Ifá-Lang (CPU, GPU, Storage, Kernel)"

[dependencies]
ifa-types = { path = "../ifa-types" }

tokio = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dependencies.rayon]
workspace = true
optional = true

[dependencies.wgpu]
workspace = true
optional = true

[dependencies.bytemuck]
workspace = true
optional = true

[dependencies.pollster]
version = "0.3"
optional = true

[dependencies.bincode]
version = "1.3"
optional = true

[features]
default = ["parallel"]
parallel = ["rayon"]
gpu = ["wgpu", "bytemuck"]
gpu_native = ["gpu", "tokio", "pollster"]
persistence = ["bincode", "tokio/fs", "tokio/io-util"]
kernel = ["sysinfo"]
sysinfo = ["dep:sysinfo"]
profiling = []
