[package]
name = "ifa-std"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standard library for Ifá-Lang - The 16 Odù Domains"

[lib]
name = "ifa_std"
path = "src/lib.rs"

[dependencies]
# Shared types (IfaValue, IfaError, OduDomain)
ifa-types = { path = "../ifa-types", features = ["dashmap"] }

ifa-sandbox = { path = "../ifa-sandbox", optional = true }
ifa-vm = { path = "../ifa-vm", default-features = false }
ifa-infra = { path = "../ifa-infra", optional = true }
futures-channel = { version = "0.3", optional = true }

# Error handling
thiserror.workspace = true
eyre.workspace = true

# Concurrent HashMap (DashMap for performance)
dashmap = { version = "6.1", optional = true }
once_cell = "1.19"

# Console I/O (Ìrosù)
crossterm = { workspace = true, optional = true }

# Date/Time (Ìwòrì)
chrono.workspace = true

# Strings (Ìká)
ropey.workspace = true
regex.workspace = true


# serialization
serde.workspace = true
serde_json.workspace = true
csv = "1.3"
urlencoding = "2.1"
uuid = { workspace = true }

# Random (Ọ̀wọ́nrín)
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }

# Crypto (Ìrẹtẹ̀)
ring = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }  # Password hashing
zstd = { workspace = true, optional = true }
base64.workspace = true

# Math/ML (Ògúndá)
ndarray = { version = "0.15", optional = true }

# Database (Òdí)
rusqlite = { workspace = true, optional = true }
memmap2 = "0.9"

# Async (Ọ̀sá)
tokio = { workspace = true, optional = true }

# Networking (Òtúrá)
reqwest = { workspace = true, optional = true }

tokio-rustls = { workspace = true, optional = true }
tl = { version = "0.7.7", optional = true } # HTML Parser (Ìkọ́)

# Terminal UI (Ọ̀ṣẹ́)
ratatui = { workspace = true, optional = true }

# Polyglot FFI (Ìrẹtẹ̀/Òfún)
libloading = { version = "0.8", optional = true }
libffi = { version = "3.2", optional = true }  # Native dynamic calls
boa_engine = { version = "0.19", optional = true }
pyo3 = { version = "0.27", features = ["auto-initialize"], optional = true }
libc = { version = "0.2", optional = true }

# Audio (Ìrosù)
rodio = { version = "0.17", optional = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
pollster = "0.3"


[dev-dependencies]
tempfile = "3.10"

[dependencies.heapless]
version = "0.8"
optional = true

[dependencies.bincode]
version = "1.3"
optional = true

[features]
default = ["network", "database", "parallel", "dashmap", "rand"]
full = []

# Language Features
js = ["boa_engine"]
python = ["pyo3"]
native_ffi = ["libffi", "libloading", "libc", "ring"]  # Dynamic C calls via libffi (not WASM-compatible)

# Performance Features
dashmap = ["ifa-types/dashmap", "dep:dashmap"]

# Domain/Capability Features
network = ["tokio", "reqwest", "tokio-rustls", "ifa-sandbox"]
database = ["dep:rusqlite", "ifa-sandbox"]
tui = ["dep:crossterm", "dep:ratatui"]
async_runtime = ["tokio"]
crypto = ["ring", "argon2"]


# Infrastructure Features
parallel = ["ifa-vm/parallel", "ifa-infra/parallel"]
gpu = ["ifa-infra/gpu", "dep:wgpu", "dep:bytemuck"]
gpu_native = ["gpu", "ifa-infra/gpu_native"]
persistence = ["tokio/fs", "tokio/io-util", "ifa-infra/persistence"]
profiling = []
# Kernel / System info
kernel = ["ifa-infra/kernel"]
sysinfo = ["ifa-infra/sysinfo"]

audio = ["dep:rodio"]
html = ["dep:tl"]

# WASM Feature (Optimized for Playground)
wasm = [
    "rsa_math",
    "dep:futures-channel",
]

# Aliases
rsa_math = ["ndarray", "rand"]
wgpu = ["dep:wgpu"]
bytemuck = ["dep:bytemuck"]
rand = ["dep:rand", "dep:rand_chacha"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.42"
