[package]
name = "ifa-babalawo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The Babalawo - Compile-time error checker for Ifá-Lang with proverb-based messages"

[dependencies]
ifa-types = { path = "../ifa-types", features = ["vm"] }
colored = "2.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
once_cell = "1.19"
ifa-sandbox = { path = "../ifa-sandbox" }
ifa-macros = { path = "../ifa-macros" }

[dev-dependencies]
ifa-parser = { path = "../ifa-parser" }
